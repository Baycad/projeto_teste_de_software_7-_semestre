<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baycad RH — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Estilos específicos para centralizar a tela de login */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f8fafc;
      margin: 0;
    }
    .login-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 24px;
      color: #0f172a;
      margin: 0 0 8px 0;
      font-weight: 700;
    }
    .login-header span {
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>Acesso ao Sistema</h1>
      <span>Baycad RH · v1.0</span>
    </div>

    <form onsubmit="efetuarLogin(event)">
      <div class="form-group">
        <label class="form-label">CPF</label>
        <input type="text" class="form-input" id="l-cpf" placeholder="000.000.000-00" 
               oninput="maskCPF(this); clearErr('login')" maxlength="14" required>
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" class="form-input" id="l-senha" placeholder="••••••••" 
               oninput="clearErr('login')" required>
        <span class="field-error" id="err-login">CPF ou senha incorretos.</span>
      </div>

      <div class="form-actions" style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Entrar</button>
      </div>
    </form>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/login.js"></script>

</body>
</html>

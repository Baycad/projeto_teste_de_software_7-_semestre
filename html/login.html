<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baycad RH — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Estilos específicos para centralizar a tela de login */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f8fafc;
      margin: 0;
    }
    .login-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 24px;
      color: #0f172a;
      margin: 0 0 8px 0;
      font-weight: 700;
    }
    .login-header span {
      color: #64748b;
      font-size: 14px;
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }
    .login-footer a {
      color: #3b82f6;
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>Acesso ao Sistema</h1>
      <span>Baycad RH · v1.0</span>
    </div>

    <form onsubmit="efetuarLogin(event)">
      <div class="form-group">
        <label class="form-label">CPF</label>
        <input type="text" class="form-input" id="l-cpf" placeholder="000.000.000-00" 
               oninput="maskCPF(this); clearErr('login')" maxlength="14" required>
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" class="form-input" id="l-senha" placeholder="••••••••" 
               oninput="clearErr('login')" required>
        <span class="field-error" id="err-login">CPF ou senha incorretos.</span>
      </div>

      <div class="form-actions" style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Entrar</button>
      </div>
    </form>

    <div class="login-footer">
      Não tem acesso?
      <a href="#" onclick="abrirSolicitacao(event)">Solicitar acesso</a>
    </div>
  </div>

  <!-- MODAL SOLICITAÇÃO DE ACESSO -->
  <div class="modal-overlay" id="modal-solicitar">
    <div class="modal" style="text-align:left; max-width:460px;">

      <!-- Estado: formulário -->
      <div id="solicitar-form">
        <h3 style="text-align:center;">Solicitar acesso</h3>
        <p style="text-align:center; color:#64748b; font-size:13px; margin-bottom:8px;">
          Preencha os dados abaixo. Um administrador analisará seu pedido.
        </p>

        <div class="form-group">
          <label class="form-label">Nome completo <span class="required">*</span></label>
          <input type="text" class="form-input" id="s-nome" placeholder="Seu nome" maxlength="70">
        </div>

        <div class="form-group">
          <label class="form-label">CPF <span class="required">*</span></label>
          <input type="text" class="form-input" id="s-cpf" placeholder="000.000.000-00"
            oninput="maskCPF(this)" maxlength="14">
        </div>

        <div class="form-group">
          <label class="form-label">E-mail <span class="required">*</span></label>
          <input type="email" class="form-input" id="s-email" placeholder="voce@empresa.com">
        </div>

        <div class="form-group">
          <label class="form-label">Departamento <span class="required">*</span></label>
          <select class="form-select" id="s-dept">
            <option value="">Selecione um departamento</option>
            <option value="TI">TI</option>
            <option value="RH">RH</option>
            <option value="Financeiro">Financeiro</option>
            <option value="Comercial">Comercial</option>
            <option value="Operações">Operações</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Justificativa</label>
          <textarea class="form-input" id="s-justificativa" rows="3"
            placeholder="Descreva por que precisa de acesso ao sistema." style="resize:vertical;"></textarea>
        </div>

        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="fecharSolicitacao()">Cancelar</button>
          <button class="btn btn-primary" onclick="enviarSolicitacao()">Enviar solicitação</button>
        </div>
      </div>

      <!-- Estado: confirmação -->
      <div id="solicitar-sucesso" style="display:none; text-align:center; padding:8px 0;">
        <div class="modal-icon" style="background:rgba(34,197,94,0.12);">
          <svg width="22" height="22" fill="none" stroke="#22c55e" stroke-width="2.5" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h3>Solicitação enviada!</h3>
        <p>Recebemos seu pedido de acesso. Você será notificado por e-mail assim que for aprovado.</p>
        <div class="modal-actions" style="justify-content:center;">
          <button class="btn btn-primary" onclick="fecharSolicitacao()">Entendi</button>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/login.js"></script>

</body>
</html>
